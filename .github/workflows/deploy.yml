name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check backend imports
        working-directory: backend
        env:
          # Only needs to parse; no connection is made at import time.
          DATABASE_URL: postgresql+psycopg://ci@localhost/ci
        run: |
          pip install -q -r requirements.txt
          python -c "import app.main"

      - name: Upload site build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: frontend/build/*
          target: /opt/webApp/bizinsight/frontend/build.new
          strip_components: 2
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          # Update the checkout first so the deploy script that runs is the one from this commit.
          script: |
            cd /opt/webApp/bizinsight
            git fetch --quiet origin master
            git checkout --quiet -B master origin/master
            bash deploy/deploy.sh
