# companies.aicloud.co.nz - BIZInsight frontend (static build) + FastAPI backend.
# Install: /etc/nginx/sites-available/, symlink into sites-enabled, then run
#   certbot --nginx -d companies.aicloud.co.nz
# which adds the 443 listener and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name companies.aicloud.co.nz;

    root /opt/bizinsight/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite puts content-hashed files here, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /companies/:id, ...) all serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
