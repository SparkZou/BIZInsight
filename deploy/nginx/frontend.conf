# nginx inside the bizinsight-frontend container. TLS, compression and the /api/* route
# are handled by the shared Caddy in front of it.
server {
    listen 80;
    server_name _;

    root /srv/frontend/dist;
    index index.html;

    # Vite puts content-hashed files here, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry page so a deploy takes effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/dashboard, /companies/:id, ...) all serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
