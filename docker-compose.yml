# ============================================================
# BIZInsight — https://companies.aicloud.co.nz
# Path on server: /opt/webApp/bizinsight (git checkout of SparkZou/BIZInsight)
#
#   bizinsight-web     : server-rendered React Router site (Node), serves frontend/build uploaded by GitHub Actions
#   bizinsight-backend : FastAPI (/api/*, including the /admin bulk data import), on both networks
#   bizinsight-db      : Postgres 16, internal only (bizinsight-net)
#
# The shared Caddy (/opt/webApp/caddy) terminates TLS and routes:
#   /api/*  -> bizinsight-backend:8000
#   the rest -> bizinsight-web:3000
# Site block: deploy/caddy/companies.aicloud.co.nz.caddy
#
# Secrets come from ./.env (POSTGRES_PASSWORD, ADMIN_PASSWORD, ADMIN_SECRET_KEY) — not committed.
# ============================================================

# Pinned so the project (and its volume) name never depends on the checkout directory.
name: bizinsight

services:
  bizinsight-web:
    build: ./frontend
    image: bizinsight-web:latest
    container_name: bizinsight-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Loaders fetch from the API over the internal network; browsers use /api on the site origin.
      API_INTERNAL_URL: http://bizinsight-backend:8000
    volumes:
      # The parent directory is mounted (not build itself) so deploy.sh can swap in a new build
      # with a rename; the server picks the new files up on restart.
      - ./frontend/build:/app/build:ro
    depends_on:
      bizinsight-backend:
        condition: service_healthy
    networks:
      - bizinsight-net
      - shared-proxy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  bizinsight-backend:
    build: ./backend
    image: bizinsight-backend:latest
    container_name: bizinsight-backend
    restart: unless-stopped
    # Same uid/gid as the server's ubuntu user, so bulk data uploaded through /admin into ./data
    # stays manageable from the host (deploy/import-bulk-data.sh writes there too).
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql+psycopg://bizinsight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@bizinsight-db:5432/nzcompanies
      BACKEND_CORS_ORIGINS: https://companies.aicloud.co.nz
      SITE_URL: https://companies.aicloud.co.nz
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-}
      DATA_DIR: /data
    volumes:
      # Companies Office bulk CSVs: written by the /admin import and deploy/import-bulk-data.sh
      - ./data:/data
    depends_on:
      bizinsight-db:
        condition: service_healthy
    networks:
      - bizinsight-net
      - shared-proxy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  bizinsight-db:
    image: postgres:16-alpine
    container_name: bizinsight-db
    restart: unless-stopped
    # The 1.7M-row company_index and its indexes are read on every public page; the defaults
    # (128MB of shared buffers) keep them on disk. The server has 4GB shared with twenty other
    # containers, so this stays modest: work_mem in particular multiplies across the joins of the
    # monthly company_index build, and 32MB was enough to get the build OOM-killed.
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "effective_cache_size=512MB", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=64MB"]
    environment:
      POSTGRES_DB: nzcompanies
      POSTGRES_USER: bizinsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - bizinsight-db-data:/var/lib/postgresql/data
    ports:
      # Loopback only: Docker publishes ports straight into iptables and bypasses UFW.
      # Admin access goes through a tunnel: ssh -L 5436:127.0.0.1:5436 ubuntu@223.165.71.59
      - "127.0.0.1:5436:5432"
    networks:
      - bizinsight-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizinsight -d nzcompanies"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  shared-proxy-network:
    external: true
    name: shared-proxy-network
  bizinsight-net:
    driver: bridge

volumes:
  bizinsight-db-data:
